[package]
name = "pub-suite-conformance"
description = "The conformance command of suite: proves the reusable workflows produce the check runs the rulesets require"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The binary is what CI runs; the crate keeps the pub-suite-<name> name.
[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
# YAML 1.2, so `on:` stays a key (a YAML 1.1 parser reads it as the boolean true) and the rules, which GitHub hands
# out as JSON, parse with the same crate. Default features off: the inputs are UTF-8, so the transcoding crate stays out.
yaml-rust2 = { version = "0.12.0", default-features = false }

[lints]
workspace = true
