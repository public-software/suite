# Machine-readable entry for this repository. Aggregated into public-software/catalog.
# Edit here; `pub catalog sync` propagates description, topics and custom properties to GitHub.

[repo]
name        = "suite"
ring        = "spine"          # spine | platform | system | domain | standards
layers      = ["all"]
wave        = 1
tier        = "incubating"        # incubating | stable | core | archived
maintainers = ["maint-suite"]
summary     = "The superproject: lockfile pinning every crate, nightly whole-suite build, compatibility matrix, release trains, reference images."

# One [[component]] per crate, app or service this workspace publishes.
# planned: Cargo.lock · compat-matrix · release notes assembler · reference platform images

# The conformance command: proves the reusable workflows of public-software/.github produce every check run the
# rulesets require, on pull requests and in the merge queue alike (crates/pub-suite-conformance).
[[component]]
crate     = "pub-suite-conformance"
kind      = "app"
ledger    = "ci-conformance"
readiness = "partial"
effort    = 1
specs     = []
provides  = []
requires  = []
